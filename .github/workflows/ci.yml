# Action versions are the lowest major that actually runs on node24, which is
# what clears the Node 20 deprecation -- not simply the newest major. The two
# artifact actions are why the numbers look uneven: upload-artifact@v5 and
# download-artifact@v5/v6 are still node20, so they had to go to v6 and v7.
# Deliberately NOT download-artifact@v8: it stops unconditionally unzipping and
# switches on the Content-Type header instead, a behaviour change this workflow
# has no need for. All of these require Actions Runner >= 2.327.1.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: "Publish the built distribution to TestPyPI"
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # pants.toml pins interpreter_constraints to ==3.12.*, and
      # [python-bootstrap] search_path includes "<PATH>", so Pants finds this one.
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # pyspark 4.1 needs a modern JVM; the integration tests run embedded Spark.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Pants caches
        shell: bash
        run: |
          echo "PANTS_NAMED_CACHES_DIR=$HOME/.cache/pants/named_caches" >> "$GITHUB_ENV"
          echo "PANTS_LOCAL_STORE_DIR=$HOME/.cache/pants/lmdb_store" >> "$GITHUB_ENV"

      - name: Cache Pants
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pants/named_caches
            ~/.cache/pants/lmdb_store
            ~/.cache/nce
          key: pants-${{ runner.os }}-${{ hashFiles('spark_sql_migrations/python-default.lock', 'spark_sql_migrations_test/python-dev.lock', 'pants.toml') }}
          restore-keys: pants-${{ runner.os }}-

      - name: Install Pants
        shell: bash
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v pants >/dev/null; then
            curl --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 \
              --retry-all-errors --create-dirs -fsSLo "$RUNNER_TEMP/get-pants.sh" \
              https://static.pantsbuild.org/setup/get-pants.sh
            bash "$RUNNER_TEMP/get-pants.sh"
          fi
          pants --version

      # Deliberately NOT `pants generate-lockfiles`: the lockfiles are committed,
      # and regenerating here would hide drift between them and the requirements
      # files. Pants fails loudly if they are stale, which is the wanted signal.
      # `dir::` and not `dir/`: a bare directory argument expands to the targets in
      # that directory only, so everything under spark_sql/ and integration/ went
      # unchecked. scripts/ is listed because scripts/BUILD exists for exactly this.
      - name: Validate autoformat and types
        run: |
          pants lint check spark_sql_migrations:: spark_sql_migrations_test:: scripts::

      - name: Prepare pytest tmp dir
        shell: bash
        run: |
          mkdir -p "$HOME/.cache/pytest-tmp"
          echo "PYTEST_TMP_BASE=$HOME/.cache/pytest-tmp" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          rm -rf dist/test/reports
          pants test --output=all --test-force --use-coverage --report spark_sql_migrations_test/:: -spark_sql_migrations_test/integration::

      - name: Run integration tests
        # Runs after unit tests complete, as its own pants invocation, never fanned out
        # alongside them. Integration tests aren't covered by --use-coverage: coverage
        # only comes from unit tests (see CLAUDE.md "Laws of integration testing").
        run: |
          pants test --output=all --test-force --report spark_sql_migrations_test/integration::

      - name: Enforce minimum test count
        run: |
          python - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          total = 0
          for f in glob.glob("dist/test/reports/*.xml"):
              root = ET.parse(f).getroot()
              for ts in root.iter("testsuite"):
                  total += int(ts.get("tests", 0)) - int(ts.get("skipped", 0))
          print(f"Total tests run: {total}")
          if total < 1:
              print("::error::Fewer than 1 tests were run", file=sys.stderr)
              sys.exit(1)
          EOF

  build:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.dist.outputs.version }}
      published: ${{ steps.pypi.outputs.published }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure Pants caches
        shell: bash
        run: |
          echo "PANTS_NAMED_CACHES_DIR=$HOME/.cache/pants/named_caches" >> "$GITHUB_ENV"
          echo "PANTS_LOCAL_STORE_DIR=$HOME/.cache/pants/lmdb_store" >> "$GITHUB_ENV"

      - name: Cache Pants
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pants/named_caches
            ~/.cache/pants/lmdb_store
            ~/.cache/nce
          key: pants-${{ runner.os }}-${{ hashFiles('spark_sql_migrations/python-default.lock', 'spark_sql_migrations_test/python-dev.lock', 'pants.toml') }}
          restore-keys: pants-${{ runner.os }}-

      - name: Install Pants
        shell: bash
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v pants >/dev/null; then
            curl --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 \
              --retry-all-errors --create-dirs -fsSLo "$RUNNER_TEMP/get-pants.sh" \
              https://static.pantsbuild.org/setup/get-pants.sh
            bash "$RUNNER_TEMP/get-pants.sh"
          fi
          pants --version

      # One distribution, three install flavours. `spark_sql_migrations` pulls no Spark at
      # all; [local] adds pyspark + delta-spark; [databricks] adds
      # databricks-connect, which ships its own top-level pyspark/ and delta/ and
      # so can never coexist with the other flavour.
      - name: Build distribution
        run: |
          pants package //:dist

      - name: Report distribution metadata
        id: dist
        shell: bash
        run: |
          wheel="$(ls dist/spark_sql_migrations-*.whl)"
          version="$(python - "$wheel" <<'EOF'
          import sys, zipfile
          root = zipfile.Path(zipfile.ZipFile(sys.argv[1]))
          info = next(p for p in root.iterdir() if p.name.endswith(".dist-info"))
          for line in (info / "METADATA").read_text().splitlines():
              if line.startswith("Version:"):
                  print(line.split(":", 1)[1].strip())
                  break
          EOF
          )"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "built spark_sql_migrations ${version}"
          python - "$wheel" <<'EOF'
          import sys, zipfile
          root = zipfile.Path(zipfile.ZipFile(sys.argv[1]))
          info = next(p for p in root.iterdir() if p.name.endswith(".dist-info"))
          for line in (info / "METADATA").read_text().splitlines():
              if line.startswith(("Name:", "Version:", "Requires-Python:", "Requires-Dist:", "Provides-Extra:")):
                  print("  " + line)
          EOF

      # PyPI, not git history, decides whether this version has shipped: that
      # survives squash merges, multi-commit pushes, and a publish that failed.
      # The version is the wheel's normalized METADATA one, which is what PyPI stores.
      - name: Check whether this version is on PyPI
        id: pypi
        shell: bash
        run: |
          version="${{ steps.dist.outputs.version }}"
          if [ -z "$version" ]; then
            echo "::error::could not read Version from the built wheel"
            exit 1
          fi
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/spark_sql_migrations/${version}/json")"
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT"; echo "${version} is already on PyPI" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT"; echo "${version} is not on PyPI yet" ;;
            # A PyPI outage must not fail CI on every branch; it just skips publishing.
            *)   echo "published=unknown" >> "$GITHUB_OUTPUT"
                 echo "::warning::PyPI returned HTTP ${status} for ${version}; skipping publish" ;;
          esac

      - name: Upload distribution
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  verify-install:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: bare
            extra: ""
          - flavour: local
            extra: "[local]"
          - flavour: databricks
            extra: "[databricks]"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # databricks-connect is Requires-Python ==3.12.*; keep all three flavours
      # on the same interpreter so the comparison is honest.
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download distribution
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Install spark_sql_migrations${{ matrix.extra }}
        shell: bash
        run: |
          wheel="$(ls dist/spark_sql_migrations-*.whl)"
          python -m pip install --upgrade pip
          python -m pip install "${wheel}${{ matrix.extra }}"

      - name: Import check
        shell: bash
        run: python scripts/verify_install.py "${{ matrix.flavour }}"

  publish-testpypi:
    needs: verify-install
    if: github.event_name == 'workflow_dispatch' && inputs.publish_testpypi
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # Bumping the version in the root BUILD and pushing it to main is the release:
  # publish runs whenever main builds a version PyPI doesn't have yet, then tags it.
  publish-pypi:
    # `build` is needed for its outputs, not for ordering (verify-install already
    # depends on it). needs.<job> is only in scope for jobs named here, so dropping
    # it makes needs.build.outputs.* silently empty rather than an error -- and an
    # empty `published` would then never equal 'false', so nothing would publish.
    needs: [build, verify-install]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.build.outputs.published == 'false'
    runs-on: ubuntu-latest
    environment: pypi
    # Two quick merges to main must not race to upload the same version.
    concurrency:
      group: publish-pypi
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # A release created with GITHUB_TOKEN triggers no workflows, so this can't
      # loop back into another run. Only the wheel and sdist are attached: the
      # publish action leaves its attestation files in dist/ as well.
      - name: Tag and create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/*.whl dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v${VERSION}" --generate-notes
