[GLOBAL]
pants_version = "2.30.0"
backend_packages.add = [
  "pants.backend.python",
  "pants.backend.build_files.fmt.black",
  "pants.backend.python.lint.black",
  "pants.backend.python.lint.flake8",
  "pants.backend.python.lint.isort",
  "pants.backend.python.typecheck.mypy",
]

[source]
root_patterns = ["/"]

[python]
interpreter_constraints = ["==3.12.*"]
enable_resolves = true
resolves = { python-default = "spark_sql_migrations/python-default.lock", py-reqs-dev = "spark_sql_migrations_test/python-dev.lock"}

[python-bootstrap]
search_path = ["<PATH>", "<PYENV>"]

# Pants ships its own tool lockfiles, so without these it would use its bundled
# versions (e.g. isort 5.13.2) and silently ignore the pins in
# requirements-dev.txt. install_from_resolve makes the gates run the exact
# versions this repo pins, which is also what the pyenv venvs and the IDE use.
[black]
install_from_resolve = "py-reqs-dev"
requirements = ["black"]

[flake8]
install_from_resolve = "py-reqs-dev"
requirements = ["flake8"]

[isort]
install_from_resolve = "py-reqs-dev"
requirements = ["isort"]

[mypy]
install_from_resolve = "py-reqs-dev"
requirements = ["mypy"]

[test]
extra_env_vars = ["WHICH_SPARK", "SPARK_CONNECT_HOST", "SPARK_CONNECT_PORT", "PYTEST_TMP_BASE"]

[coverage-py]
filter = ["spark_sql_migrations"]
report = ["console"]
global_report = true
fail_under = 94
